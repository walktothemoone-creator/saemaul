# 검색어 확장 사전. 사람이 쓰는 말과 사료의 말이 다를 때를 메운다.
# Query expansion. Bridges everyday wording, period wording, hanja and English.
#
# 왼쪽 열쇠말로 검색하면 오른쪽 낱말도 함께 찾는다. 반대 방향도 적용된다.
# 한 줄을 추가할 때는 "같은 것을 가리키는 다른 말"만 넣는다. 연관어는 넣지 않는다.

