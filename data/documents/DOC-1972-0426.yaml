  kind: passage
  ref: §8-(2)
  section: '8'
  section_heading: 이제부터는 이 사업(事業)을 어디로 이끌어 갈 것이냐?
  label: (2)
  text: 앞으로 소득(所得)에 직접적으로 연결(連結)하지 못하면 이 열(熱)은 식어버린다.
  text_plain: 앞으로 소득에 직접적으로 연결하지 못하면 이 열은 식어버린다.
