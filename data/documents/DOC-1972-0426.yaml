- id: p009
  kind: passage
  ref: §2-(3)
  section: '2'
  section_heading: 확실(確實)히 우리 민족(民族)은 잠재적(潛在的)으로 무한(無限)한 저력(底力)을 가진 민족이다.
  label: (3)
  text: 그러나 우리는 이러한 역경에 굴하지 않았다. 침략자(侵略者)에 대(對)해서는 대결(對決)해서 싸워서 이길 수 있는 힘을 길러야 하고, 천재는 하늘을 쳐다보고 원망(怨望)할
    것이 아니라 이것을 극복(克服)하는 방법(方法)을 모색(摸索)해야 하고, 가난은 부지런히 일하면 잘 살 수 있다는 것을 깨달았다.
  text_plain: 그러나 우리는 이러한 역경에 굴하지 않았다. 침략자에 대해서는 대결해서 싸워서 이길 수 있는 힘을 길러야 하고, 천재는 하늘을 쳐다보고 원망할 것이 아니라 이것을
    극복하는 방법을 모색해야 하고, 가난은 부지런히 일하면 잘 살 수 있다는 것을 깨달았다.
  hanja:
