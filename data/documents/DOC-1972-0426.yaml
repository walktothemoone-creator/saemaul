  - 窮極的目標
  - 農漁民所得
- id: p052
  kind: passage
  ref: §8
  section: '8'
  section_heading: 이제부터는 이 사업(事業)을 어디로 이끌어 갈 것이냐?
  label: ''
  text: 농어촌(農漁村)을 부유(富裕)하게 해서 우리 농민(農民)들이 보다 여유 있고 품위 있고 보다 문화적생활(文化的生活)을 누릴 수 있으며, 이웃끼리 서로 사랑하고 서로 화목(和睦)하게
    살기 좋은 마을을 만들어 사랑하는 우리 후손(後孫)들에게 떳떳하게 물려 줄 수 있는 내 고장.
  text_plain: 농어촌을 부유하게 해서 우리 농민들이 보다 여유 있고 품위 있고 보다 문화적생활을 누릴 수 있으며, 이웃끼리 서로 사랑하고 서로 화목하게 살기 좋은 마을을 만들어
    사랑하는 우리 후손들에게 떳떳하게 물려 줄 수 있는 내 고장.
  hanja:
  - 和睦
  - 富裕
  - 後孫
  - 文化的生活
  - 農民
  - 農漁村
