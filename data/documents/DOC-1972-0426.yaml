- id: p072
  kind: passage
  ref: §10-(8)
  section: '10'
  section_heading: 새마을 운동을 성공적(成功的)으로 발전(發展)시켜 나가기 위(爲)하여 유의(留意)할 일
  label: (8)
  text: 이 운동은 민족적대약진운동(民族的大躍進運動)이다. 농촌에만 해당(該當)하는 운동은 결코 아니다. 범국민운동(汎國民運動)이다. 도시민(都市民)들도 참여(參與)하고 적극적
    협조해야 한다. 아무도 방관자(傍觀者)가 될 수 없다. 그렇다고 나는 도시 사람들에게 시골에 가서 농로를 뚫고 지붕개량사업(改良事業)을 직접 해달라는 것은 아니다. 도시민들은
    도시민들로서 뭣인가 이 운동을 도우는 길이 있을 것이다. 최소한 도우지 못한다면 훼방을 놓지 않아야 하겠고, 방해(妨害)는 하지 않아야 하겠다. 일부(一部) 도시민들의 지각(知覺)
    없는 생활태도(生活態度)는 이 운동에 찬물을 끼얹는 결과를 가져올 수도 있다. 최소한 이런 일은 하지 않아야 하지 않겠는가?
  text_plain: 이 운동은 민족적대약진운동이다. 농촌에만 해당하는 운동은 결코 아니다. 범국민운동이다. 도시민들도 참여하고 적극적 협조해야 한다. 아무도 방관자가 될 수 없다.
    그렇다고 나는 도시 사람들에게 시골에 가서 농로를 뚫고 지붕개량사업을 직접 해달라는 것은 아니다. 도시민들은 도시민들로서 뭣인가 이 운동을 도우는 길이 있을 것이다. 최소한 도우지
    못한다면 훼방을 놓지 않아야 하겠고, 방해는 하지 않아야 하겠다. 일부 도시민들의 지각 없는 생활태도는 이 운동에 찬물을 끼얹는 결과를 가져올 수도 있다. 최소한 이런 일은 하지
    않아야 하지 않겠는가?
  hanja:
