  label: ''
  text: 열심(熱心)히 하는 데도 도와주기 힘이 드는데, 게으르고 안 하겠다는 데를 끝까지 도와줄 여력(餘力)이 없다. 이런 마을들은 언젠가 반드시 깨달을 것이다. 그때 도와 주자.
