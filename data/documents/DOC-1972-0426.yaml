  section: '1'
  section_heading: 전국에 전개되고 있는 새마을운동 (서두)
  label: (3)
  text: 특히 이 운동은 우리 농촌사회(農村社會)에서 일어나고 있는 새바람이요, 서광(曙光)이요 희망(希望)이라고 본다. 우리 역사상(歷史上) 과거(過去)에도 찾아볼 수 없던 일이다.
  text_plain: 특히 이 운동은 우리 농촌사회에서 일어나고 있는 새바람이요, 서광이요 희망이라고 본다. 우리 역사상 과거에도 찾아볼 수 없던 일이다.
