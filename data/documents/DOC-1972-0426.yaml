  label: (6)
  text: 전반기사업성과(前半期事業成果) 분석(分析)하여 성과(成果)가 좋은 부락에 집중투자(集中投資)할 예정(豫定). 가급적(可及的)이면 환경정리(環境整理)보다 소득증대(所得增大)에
