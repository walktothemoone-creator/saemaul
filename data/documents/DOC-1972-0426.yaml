  ref: §8-(1)
  section: '8'
  section_heading: 이제부터는 이 사업(事業)을 어디로 이끌어 갈 것이냐?
  label: (1)
  text: 이제까지 한 사업은 직접, 간접(間接)으로 소득증대(所得增大)에 기여(寄與)하는 사업이다. 그러나 본격적(本格的)인 사업으로 이끌어가기 위(爲)한 시동작업(始動作業)이요,
    대작업(大作業)이다.
  text_plain: 이제까지 한 사업은 직접, 간접으로 소득증대에 기여하는 사업이다. 그러나 본격적인 사업으로 이끌어가기 위한 시동작업이요, 대작업이다.
