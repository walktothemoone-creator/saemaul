  section_heading: 금일토의(今日討議)하는 소득증대특별사업(所得增大特別事業)
  label: 나.
  text: 근면하고 협동을 잘 했는데도 성공하지 못한 사례가 있다면 두 가지 원인(原因)이 있을 거다. 하나는... (농민(農民) 측) 영농(營農)에 있어서 과학적(科學的)인 지식(知識)과
    기술(技術)이 부족(不足)했거나. 또 하나는 정부(政府)의 지원(支援)이 잘못됐다. 자금(資金) 적기방출불행(適期放出不行), 계획생산불행(計劃生産不行), 농산물가격보장불실시(農産物價格保障不實施),
    판로개척(販路開拓) 불알선등(不斡旋等).
  text_plain: 근면하고 협동을 잘 했는데도 성공하지 못한 사례가 있다면 두 가지 원인이 있을 거다. 하나는... (농민 측) 영농에 있어서 과학적인 지식과 기술이 부족했거나.
