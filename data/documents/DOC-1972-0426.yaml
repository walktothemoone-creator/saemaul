    - 보다 더 여유(餘裕) 있고 품위(品位) 있고 문화적 생활(文化的 生活).

    - 이웃끼리 서로 사랑하고 상부상조(相扶相助)하고. 알뜰하고 아름답고 살기 좋은 내 마을.'
  text_plain: 어떻게 사는 것이 잘 사는 거냐? - 빈곤탈피 - 소득이 증대되어 부유해짐. - 보다 더 여유 있고 품위 있고 문화적 생활. - 이웃끼리 서로 사랑하고 상부상조하고.
