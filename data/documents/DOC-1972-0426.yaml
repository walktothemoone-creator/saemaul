- id: p065
  kind: passage
  ref: §10-(2)
  section: '10'
  section_heading: 새마을 운동을 성공적(成功的)으로 발전(發展)시켜 나가기 위(爲)하여 유의(留意)할 일
  label: (2)
  text: '새마을 운동은 반드시 농민들의 부락민(部落民)의 힘으로 자발적운동(自發的運動)으로 유도(誘導)되어야 한다. 스스로 부락민 마음속에서 우러난 자발적 운동이라야 성공. 위에서
    이것 하라 저것 하라 강요(强要)해서 하는 것은 성공 못 한다.

    예: 부락민들의 총의(總意)에 의(依)하여 농로(農路)를 만들기로 결정(決定)을 했다면, 못 하는 일을 도와주고, 군(郡)이나 면(面)에서는 측량설계(測量設計) 도와주고 기술지도(技術指導)를
    하고 행정지원(行政支援) 해주고. 기술공무원(技術公務員)들을 자주 방문시켜 지도(指導)를 하는 등.'
  text_plain: '새마을 운동은 반드시 농민들의 부락민의 힘으로 자발적운동으로 유도되어야 한다. 스스로 부락민 마음속에서 우러난 자발적 운동이라야 성공. 위에서 이것 하라 저것
    하라 강요해서 하는 것은 성공 못 한다. 예: 부락민들의 총의에 의하여 농로를 만들기로 결정을 했다면, 못 하는 일을 도와주고, 군이나 면에서는 측량설계 도와주고 기술지도를 하고
    행정지원 해주고. 기술공무원들을 자주 방문시켜 지도를 하는 등.'
