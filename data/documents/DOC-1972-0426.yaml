- id: p030
  kind: passage
  ref: §6
  section: '6'
  section_heading: 근면(勤勉), 자조(自助), 협동정신(協同精神)
  label: ''
  text: 이렇게 볼 때 새마을 운동이란 정신 발동(發動)이요 정신혁명운동(精神革命運動)이다. 동시(同時)에 이 운동(運動)은 말만 가지고 하는 것이 아니라 행동력(行動力)과 실천(實踐)이
    반드시 수반(隨伴)해야 한다. 행동철학(行動哲學)이다. 이렇게 되면 우리 농촌(農村)은 반드시 잘 사는 농촌이 될 수 있다.
  text_plain: 이렇게 볼 때 새마을 운동이란 정신 발동이요 정신혁명운동이다. 동시에 이 운동은 말만 가지고 하는 것이 아니라 행동력과 실천이 반드시 수반해야 한다. 행동철학이다.
    이렇게 되면 우리 농촌은 반드시 잘 사는 농촌이 될 수 있다.
