- id: p010
  kind: passage
  ref: §2-(4)
  section: '2'
  section_heading: 확실(確實)히 우리 민족(民族)은 잠재적(潛在的)으로 무한(無限)한 저력(底力)을 가진 민족이다.
  label: (4)
  text: 과거(過去)에는 이러한 역경을 우리 힘으로는 도저(到底)히 극복할 수 없는 일이라고만 생각하고 극복할 생각도 않았는데, 이제는 우리 힘으로 해낼 수 있다는 자신을 가지게
    되었다. 우리가 분발(奮發)하고, 근면(勤勉)하고 협동(協同)하고 단결(團結)하면 능(能)히 극복할 수 있다는 자신을 얻게 되었다. 이것이 새마을 운동이 일어나게 한 동기(動機)요
    원동력(原動力)이 되었다. 우연(偶然)한 일이 아니다. 팽배(澎湃)해졌다.
  text_plain: 과거에는 이러한 역경을 우리 힘으로는 도저히 극복할 수 없는 일이라고만 생각하고 극복할 생각도 않았는데, 이제는 우리 힘으로 해낼 수 있다는 자신을 가지게 되었다.
    우리가 분발하고, 근면하고 협동하고 단결하면 능히 극복할 수 있다는 자신을 얻게 되었다. 이것이 새마을 운동이 일어나게 한 동기요 원동력이 되었다. 우연한 일이 아니다. 팽배해졌다.
