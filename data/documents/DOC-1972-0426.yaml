  - 自信
  - 處
  - 轉禍爲福
  - 逆境
- id: p008
  kind: passage
  ref: §2-(2)
  section: '2'
  section_heading: 확실(確實)히 우리 민족(民族)은 잠재적(潛在的)으로 무한(無限)한 저력(底力)을 가진 민족이다.
  label: (2)
  text: 우리도 그동안 수없이 많은 고난(苦難)과 시련(試鍊)을 겪어왔다. 외적(外敵)으로부터 침략(侵略)도 받아봤고, 공산당(共産黨)의 수없이 많은 도전(挑戰)도 받아봤고, 한발(旱魃)이다
    수해(水害)다 하고 수많은 천재(天災)도 받아왔고, 조상(祖上)으로부터 물려받은 가난의 설움을 뼈에 사무칠 정도(程度)로 겪어봤다.
  text_plain: 우리도 그동안 수없이 많은 고난과 시련을 겪어왔다. 외적으로부터 침략도 받아봤고, 공산당의 수없이 많은 도전도 받아봤고, 한발이다 수해다 하고 수많은 천재도
    받아왔고, 조상으로부터 물려받은 가난의 설움을 뼈에 사무칠 정도로 겪어봤다.
