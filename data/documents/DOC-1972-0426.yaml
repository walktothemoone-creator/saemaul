id: DOC-1972-0426
title: 새마을운동 (親筆 構想 메모)
date: '1972-04-26'
place: 광주
title_en: Saemaul Undong — handwritten planning notes
kind: manuscript
author: 박정희
author_role: 대통령 (재임 1963-1979)
language: ko
script_note: 국한문 혼용 친필. 판독문은 한자를 괄호로 병기했다.
significance: '새마을운동의 핵심 개념이 외부에 정식화되기 전, 발의자가 스스로 정리한 구상 메모다.

  근면·자조·협동을 "새마을 정신"으로 묶는 대목(§6), 정신혁명운동이자 행동철학이라는 규정(§6),

  자발성 요구(§10-(2))와 성과 우수 부락 우선 지원 방침(§8-(6), §10-(4))이 한 문서 안에 같이 있다.

  이후의 공식 담론과 비판 연구가 각각 무엇을 근거로 삼는지 대조할 수 있는 출발점이다.

  이 문서는 운동의 의도를 보여 줄 뿐, 실제 집행과 결과를 보여 주지는 않는다.

  '
