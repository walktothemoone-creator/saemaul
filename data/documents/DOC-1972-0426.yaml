  - 完璧
  - 緻密
  - 計劃
- id: p075
  kind: passage
  ref: §10-(11)
  section: '10'
  section_heading: 새마을 운동을 성공적(成功的)으로 발전(發展)시켜 나가기 위(爲)하여 유의(留意)할 일
  label: (11)
  text: 모든 공무원(公務員)들은 이 운동에 앞장서고 이들을 지도하고 그들 농민을 도와 주는 일에 무한(無限)한 긍지(矜持)와 보람을 느낄 줄 알아야 한다.
  text_plain: 모든 공무원들은 이 운동에 앞장서고 이들을 지도하고 그들 농민을 도와 주는 일에 무한한 긍지와 보람을 느낄 줄 알아야 한다.
  hanja:
  - 公務員
  - 無限
  - 矜持
