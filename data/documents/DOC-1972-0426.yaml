  label: ''
  text: 나도 그동안 여러 부락(部落)을 찾아가 보고, 보고(報告)를 통(通)하여 듣고, 우리 농민(農民)들이 우리도 한번 잘 살아보겠다고 몸부림치는 그 모습을 보고 깊은 감명(感銘)을
