  text: 부락의 부녀회원(婦女會員)을 적극적(積極的)으로 참여(參與)시키고 그들의 의식(意識)을 높여 줘야 한다. 성공한 부락은 반드시 예외(例外) 없이 부락 부녀회원들의 역할(役割)이
    대단(大端)히 컸다는 것을 알고 있다. 대체(大體) 부녀들은 남자보다 더 알뜰하고 성실(誠實)하고 적극적(積極的)이다.
  text_plain: 부락의 부녀회원을 적극적으로 참여시키고 그들의 의식을 높여 줘야 한다. 성공한 부락은 반드시 예외 없이 부락 부녀회원들의 역할이 대단히 컸다는 것을 알고 있다.
    대체 부녀들은 남자보다 더 알뜰하고 성실하고 적극적이다.
