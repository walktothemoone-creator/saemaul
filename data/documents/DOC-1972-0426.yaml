  section_heading: 이제부터는 이 사업(事業)을 어디로 이끌어 갈 것이냐?
  label: (3)
  text: 새마을 운동의 궁극적목표(窮極的目標)는 농어민소득(農漁民所得)을 증대(增大)하여 잘 사는 농촌을 만드는 데 있다. (잘 살기 운동)
  text_plain: 새마을 운동의 궁극적목표는 농어민소득을 증대하여 잘 사는 농촌을 만드는 데 있다. (잘 살기 운동)
  hanja:
