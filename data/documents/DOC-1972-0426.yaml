  section: '7'
  section_heading: 어떻게 행동(行動)에 옮기느냐 (실천단계(實踐段階))
  label: ''
  text: 사업 선정(選定)이 되고, 계획이 섰다. 훌륭한 지도자가 있고 부락민 설득됐고. 계획을 세워서 체계적(體系的)으로 추진. 이와 같이 하면 반드시 성공한다. 이와 같이 한
    부락은 반드시 성공했다. 이와 같이 해서 성공한 부락은 근면과 협동이 얼마나 필요(必要)하다는 것을 깨닫게 되고 자기들이 이룩한 일이 엄청나게 거창(巨創)한 일을 했구나 하고
    스스로 놀라게 된다.
  text_plain: 사업 선정이 되고, 계획이 섰다. 훌륭한 지도자가 있고 부락민 설득됐고. 계획을 세워서 체계적으로 추진. 이와 같이 하면 반드시 성공한다. 이와 같이 한 부락은
