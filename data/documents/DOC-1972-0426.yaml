- id: p006
  kind: passage
  ref: §2-(4)
  section: '2'
  section_heading: 확실(確實)히 우리 민족(民族)은 잠재적(潛在的)으로 무한(無限)한 저력(底力)을 가진 민족이다.
  label: (4)
  text: 왜 이러한 저력을 가지고 있으면서도 저력을 발휘(發揮)하지 못했느냐. 역(亦) 여기에는 어떠한 계기(契機)가 마련되어야 하고 자극(刺戟)이 있어야 된다고 본다. 지난 10년
    동안 1, 2차(次) 5년계획(年計劃)을 통(通)해서 우리 국민(國民)들이 땀 흘려 이룩한 건설성과(建設成果)가 우리 농민들로 하여금 큰 자극을 주었고 이러한 오랜 침체(沈滯)
    속에서 잠을 깨고 눈을 뜰 수 있는 계기를 만들어 주었다고 봐야 할 것이다. 우리도 하면 된다 하는 자신(自信)이 생겼다.
  text_plain: 왜 이러한 저력을 가지고 있으면서도 저력을 발휘하지 못했느냐. 역 여기에는 어떠한 계기가 마련되어야 하고 자극이 있어야 된다고 본다. 지난 10년 동안 1,
    2차 5년계획을 통해서 우리 국민들이 땀 흘려 이룩한 건설성과가 우리 농민들로 하여금 큰 자극을 주었고 이러한 오랜 침체 속에서 잠을 깨고 눈을 뜰 수 있는 계기를 만들어 주었다고
    봐야 할 것이다. 우리도 하면 된다 하는 자신이 생겼다.
  hanja:
