- id: p071
  kind: passage
  ref: §10-(7)
  section: '10'
  section_heading: 새마을 운동을 성공적(成功的)으로 발전(發展)시켜 나가기 위(爲)하여 유의(留意)할 일
  label: (7)
  text: 훌륭한 부락지도자의 발굴(發掘)과 양성(養成)에 정부는 계속(繼續) 노력(努力)해야 한다. 한 사람의 훌륭한 부락지도자가 한 마을을 완전히 일어나도록 만든 사례를 많이
    보고 있다. 이들이 이룩한 업적(業績)을 기록(記錄)에 남기고 후세(後世) 역사(歷史)에 남겨야 한다. 이들이 바로 우리 농촌 영웅(英雄)이다.
  text_plain: 훌륭한 부락지도자의 발굴과 양성에 정부는 계속 노력해야 한다. 한 사람의 훌륭한 부락지도자가 한 마을을 완전히 일어나도록 만든 사례를 많이 보고 있다. 이들이
    이룩한 업적을 기록에 남기고 후세 역사에 남겨야 한다. 이들이 바로 우리 농촌 영웅이다.
