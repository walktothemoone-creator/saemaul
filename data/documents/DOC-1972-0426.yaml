  section: '1'
  section_heading: 전국에 전개되고 있는 새마을운동 (서두)
  label: (2)
  text: 도지사(道知事) 이하(以下) 시장(市長) 기타(其他) 공무원(公務員)들이 토요일(土曜日) 일요일(日曜日) 없이 잠바 바람에 밤낮을 가리지 않고 뛰어 다니면서 이들을 지도(指導)하고
    격려(激勵)하면서도 지칠 줄 모르고 보람을 느끼는 것도 우리 농민들의 그 부지런한 모습에 감동(感動)되었기 때문이라고 생각한다.
  text_plain: 도지사 이하 시장 기타 공무원들이 토요일 일요일 없이 잠바 바람에 밤낮을 가리지 않고 뛰어 다니면서 이들을 지도하고 격려하면서도 지칠 줄 모르고 보람을 느끼는
    것도 우리 농민들의 그 부지런한 모습에 감동되었기 때문이라고 생각한다.
