  section_heading: 이제부터는 이 사업(事業)을 어디로 이끌어 갈 것이냐?
  label: (4)
  text: 농번기(農繁期)에 접어드는 지금부터 할 일
  text_plain: 농번기에 접어드는 지금부터 할 일
  hanja:
