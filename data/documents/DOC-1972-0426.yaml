  label: 가.
  text: 성공(成功)한 사례(事例), 불성공(不成功) 사례가 있으나 성공한 사업은 근면하고 자조정신 강(强)하고 협동정신 왕성(旺盛)한 데는 성공. 불성공은 그렇지 못했던 데다.
