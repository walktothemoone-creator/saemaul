glossary:
- term: 서광(曙光)
  meaning: 새벽에 동이 틀 무렵의 빛. 희망의 징조를 비유적으로 이르는 말.
- term: 전화위복(轉禍爲福)
  meaning: 재앙과 화난이 바뀌어 오히려 복이 됨.
- term: 한발(旱魃)
  meaning: 오랫동안 비가 오지 않는 심한 가뭄.
- term: 팽배(澎湃)
  meaning: 어떤 기세나 사상 따위가 매우 높게 일어남. (원래 물결이 부딪쳐 거세게 일어난다는 뜻)
- term: 총의(總意)
  meaning: 구성원 전체의 공통된 하나된 의견.
- term: 일변도(一邊倒)
  meaning: 오로지 한쪽 방향으로만 치우침.
- term: 간이상수도(簡易上水道)
  meaning: 정수 시설을 간단히 갖추어 농어촌 등에 물을 공급하는 소규모 상수도 시설.
- term: 궁극적(窮極的)
  meaning: 어떤 일의 과정에서 맨 마지막에 도달하는 것.
- term: 농한기(農閑期)
  meaning: 농사일이 많지 않아 비교적 한가한 시기. 반대말은 농번기.
- term: 적기방출(適期放出)
  meaning: 꼭 알맞은 시기에 맞추어 자금이나 물자를 풀어 줌.
- term: 긍지(矜持)
  meaning: 자신의 능력을 믿고 스스로 당당히 여기는 마음.
