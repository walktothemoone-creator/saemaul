- id: p054
  kind: passage
  ref: §8
  section: '8'
  section_heading: 이제부터는 이 사업(事業)을 어디로 이끌어 갈 것이냐?
  label: ''
  text: 새마을 상반기사업(上半期事業) 대개(大槪) 완료(完了). 미완료분야(未完了分野) 후반기(後半期) 농한기(農閑期)로 연기(延期). 농사(農事)에 전력경주(全力傾注)할 것
    (본농사(本農事)). 농사일에도 협동을 할 수 있는 것은 협동으로 하면 더 능률이 오른다. (모내기, 김매기, 농약살포 등)
  text_plain: 새마을 상반기사업 대개 완료. 미완료분야 후반기 농한기로 연기. 농사에 전력경주할 것 (본농사). 농사일에도 협동을 할 수 있는 것은 협동으로 하면 더 능률이
    오른다. (모내기, 김매기, 농약살포 등)
