- id: p007
  kind: passage
  ref: §2-(1)
  section: '2'
  section_heading: 확실(確實)히 우리 민족(民族)은 잠재적(潛在的)으로 무한(無限)한 저력(底力)을 가진 민족이다.
  label: (1)
  text: 한 민족이 침체에서 벗어나서 대비약(大飛躍)을 할 때 가장 필요한 것이 자신(自信)이다. 의욕(意欲)이 생기며 자신감이 생긴다. 의욕과 자신이 없는 민족은 아무리 좋은
    기회(機會)가 있더라도 이것을 이용(利用)할 줄 모른다. (기회포착불가(機會捕捉不可)) 반대(反對)로 의욕과 자신이 왕성(旺盛)한 민족은 역경(逆境)에 처(處)해서도 이에 굴(屈)하지
    않고 오히려 이를 전화위복(轉禍爲福)으로 삼을 줄 아는 슬기를 발휘할 줄 안다.
  text_plain: 한 민족이 침체에서 벗어나서 대비약을 할 때 가장 필요한 것이 자신이다. 의욕이 생기며 자신감이 생긴다. 의욕과 자신이 없는 민족은 아무리 좋은 기회가 있더라도
    이것을 이용할 줄 모른다. (기회포착불가) 반대로 의욕과 자신이 왕성한 민족은 역경에 처해서도 이에 굴하지 않고 오히려 이를 전화위복으로 삼을 줄 아는 슬기를 발휘할 줄 안다.
  hanja:
