- id: p073
  kind: passage
  ref: §10-(9)
  section: '10'
  section_heading: 새마을 운동을 성공적(成功的)으로 발전(發展)시켜 나가기 위(爲)하여 유의(留意)할 일
  label: (9)
  text: 이 운동에는 물론(勿論) 여러 가지 문제(問題)도 있고 일부 부작용(副作用)도 있다. 물론 처음부터 실수(失手)가 없도록 최선(最善)을 다해야 하겠지만 일부 부작용이 있다
    해서 비방(誹謗)만 할 것은 못 된다. 시정(是正)해 나가면 된다.
  text_plain: 이 운동에는 물론 여러 가지 문제도 있고 일부 부작용도 있다. 물론 처음부터 실수가 없도록 최선을 다해야 하겠지만 일부 부작용이 있다 해서 비방만 할 것은 못
    된다. 시정해 나가면 된다.
  hanja:
  - 副作用
  - 勿論
  - 問題
  - 失手
  - 是正
  - 最善
  - 誹謗
- id: p074
  kind: passage
  ref: §10-(10)
  section: '10'
  section_heading: 새마을 운동을 성공적(成功的)으로 발전(發展)시켜 나가기 위(爲)하여 유의(留意)할 일
  label: (10)
  text: 모든 사업(事業)은 처음부터 치밀(緻密)한 계획(計劃)을 세워서 시작하고 하나 하나의 끝은 야무라지게 완벽(完璧)하게 마쳐야 한다. (다리를 놓았더니 비 한 번 오면 내려
    앉는 일은 없도록)
  text_plain: 모든 사업은 처음부터 치밀한 계획을 세워서 시작하고 하나 하나의 끝은 야무라지게 완벽하게 마쳐야 한다. (다리를 놓았더니 비 한 번 오면 내려 앉는 일은 없도록)
  hanja:
