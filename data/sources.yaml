  - id: SRC-PRI-003
    layer: primary
    title: "대통령 연설문·지시 (1970년 지방장관회의 새마을가꾸기 제창 등)"
    holder: ["대통령기록관"]
    year: 1970
    stance: foundational
    theoretical_framework: null
    url: null
    verify_status: needs_check
    note: |
      미확인(2026-10-18 웹 조사). 1970년 4월 22일 지방장관회의에서 '새마을가꾸기' 제창이 있었다는 2차 보도는 여러 건 있으나
      회의 장소가 자료마다 엇갈리고(전주 / 전국 지방장관회의), 대통령기록관의 해당 연설·지시 기록 원문을 특정하지 못했다.
      대통령기록관 연설기록 검색(pa.go.kr)에서는 1976.12.10 "전국 새마을 지도자 대회 유시" 등 다른 연설만 확인됐다.
      확인 방법: 대통령기록관(pa.go.kr) 기록컬렉션 > 연설기록에서 1970년 4월 범위로 검색하거나,
      대통령기록관 열람서비스(1522-1022)에 '1970년 지방장관회의' 기록 유무와 기록물 번호를 문의한다.
      원문 일자·문서번호 확인 후 개별 id 부여
    use_for: [정책의도, 국가담론]

  - id: SRC-PRI-004
    layer: primary
    title: "내무부 연도별 새마을운동 보고서 / 새마을지도자 성공사례 수기"
    holder: ["국가기록원", "새마을운동중앙회"]
    year: "1971-1979"
    stance: foundational
    theoretical_framework: null
    url: null
    verify_status: needs_check
    note: |
      미확인(2026-10-18 웹 조사). 내무부 생산 연도별 새마을운동 보고서와 성공사례 수기의 개별 기록물 관리번호를 특정하지 못했다.
      국가기록원 새마을운동 테마 검색(theme.archives.go.kr/next/semaul2016/searchResult.do)은 생산기관·생산연도·관리번호 범위 검색을
      제공하지만, 검색 결과 자체를 이 레지스트리의 근거 URL로 쓸 수 없다.
      확인 방법: 국가기록포털(archives.go.kr) 상세검색에서 생산기관 '내무부' + 생산연도 1971-1979 로 좁혀 건별 관리번호를 받거나,
      국가기록원 열람문의(대전 042-481-1730, 성남 031-750-2001)에 해당 시리즈의 관리번호와 공개구분을 문의한다.
      경쟁적 차등 지원(마을 등급·자재 배분) 수치의 1차 근거로 사용
    use_for: [경쟁적지원, 마을등급, 자원배분, 지도자동기]

  - id: SRC-PRI-005
    layer: primary
    title: "새마을운동 친필 구상 메모 (1972.4.26. 광주)"
    authors: ["박정희"]
    holder: ["국가기록원"]
    year: 1972
    scope_note: "대통령비서실 용지 친필 원고 17장. 근면·자조·협동의 '새마을 정신' 정식화, 정신혁명운동 규정, 자발성 요구, 성과 우수 부락 우선 지원 방침이 한 문서에 들어 있다."
    stance: foundational
    theoretical_framework: null
    url: "https://theme.archives.go.kr/next/semaul/popup/popDetail.do?e_id=0047866236&flg=Y"
    verify_status: url_verified
    document_id: DOC-1972-0426
    note: |
      국가기록원 공개 페이지 확인(2026-10-18). 철제목·건제목 "새마을운동(박정희 대통령 친필문서)", 관리번호 CZ00000201,
      생산연도 19720426, 생산기관 '지방행정연수원'(이관기관으로 보인다. 용지는 대통령비서실 것이다).
      새마을운동아카이브(archives.saemaul.or.kr/record/byType/view/301273)의 같은 문서 기록은
      1972.4.26. 광주 '새마을소득증대 촉진대회'를 격려하려고 구상한 메모이며 대통령비서실 메모지에 17쪽으로 쓰였다고 적어,
      이 레지스트리의 '17장' 기술과 일치한다. 다만 그쪽은 이 문서를 '연설문 원고 초안'으로 분류한다.
      공개구분과 복제·재배포 조건은 두 페이지 어디에도 표기가 없다. data/documents/DOC-1972-0426.meta.yaml 의 rights 참고.
      이 저장소가 스캔과 판독문을 함께 보유한다. 판독문은 원본 대조 교정 전이다.
    use_for: [정책의도, 새마을정신, 근면자조협동, 정신혁명론, 자발성, 경쟁적지원, 소득증대, 지도자, 부녀회, 국가담론]

