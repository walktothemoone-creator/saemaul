# 새마을 MCP — 출처 레지스트리 / Saemaul MCP — source registry
# 용도: 에이전트가 근거·반론·이론 출처를 조회하는 기준 목록
# 이 파일은 서지 목록이다. 원문 전문은 data/documents/ 에 따로 있다.
#
# 필드 규칙
#   id                  : 영구 식별자 (변경 금지, 주장(Claim)이 이 id로 근거를 참조)
#   layer               : primary(1차 기록) | scholarly(학술 연구) | theory(논리 정립 이론)
#                         | ontology(온톨로지 철학) | infra(검증 인프라)
#   stance              : supportive | critical | analytical | foundational  (새마을 평가 관점)
#   theoretical_framework: 해당 출처가 기반한 경제학·사회학·철학 이론 (확인된 범위만 기재)
#   verify_status       : url_verified(검색으로 URL 확인) | needs_check(서지·URL 원문 확인 필요)
#   use_for             : 이 출처로 뒷받침하거나 반박할 수 있는 주제 태그
#   document_id         : 이 저장소가 전문을 보유한 경우 data/documents/ 의 문서 id

meta:
  registry_version: "0.2"
  scope: "1970년대 한국 새마을운동 — 1차 기록·학술 연구·이론. 새마을행동론(docs/action-theory.ko.md)의 명제를 검증할 근거 목록이다"
  editorial_policy:
    - "모든 주장(Claim)은 최소 1개 근거 출처와 연결한다"
    - "평가 출처(supportive)와 비판 출처(critical)를 함께 연결해 논쟁을 지식으로 보존한다"
    - "학술 출처는 theoretical_framework를 명시한다. 이론적 기반이 불분명한 출처는 근거 등급을 낮춘다"
    - "전문을 보유한 1차 기록은 document_id로 연결하고, 단락 단위로 인용할 수 있게 한다"
    - "확인되지 않은 서지 정보는 비워 두고 needs_check로 표시한다. 지어내지 않는다"

