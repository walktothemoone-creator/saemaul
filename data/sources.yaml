  - id: SRC-PRI-001
    layer: primary
    title: "새마을운동 기록물 (유네스코 세계기록유산, 2013 등재)"
    holder: ["국가기록원", "새마을운동중앙회"]
    year: 2013
    scope_note: "총 22,084건 (국가기록원 14,647건 / 새마을운동중앙회 7,437건)"
    stance: foundational
    theoretical_framework: null
    url: "https://www.unesco.org/en/memory-world/archives-saemaul-undong-new-community-movement"
    verify_status: url_verified
    note: |
      유네스코 세계기록유산 등재 페이지 확인(2026-10-18). 등재명 "Archives of Saemaul Undong (New Community Movement)",
      등재 연도 2013(신청 2012), 신청국 대한민국, 대상 기간 1970-1979, 구성은 대통령 연설, 정부 문서, 마을 문서,
      서한, 교본, 사진, 영상이라고 적혀 있다.
      다만 유네스코 페이지는 건수를 밝히지 않는다. scope_note 의 "총 22,084건(국가기록원 14,647건 / 새마을운동중앙회 7,437건)"
      내역은 아직 1차 확인 전이므로 그대로 인용하지 않는다. 소장기관별 목록 URL도 미확인.
      개별 기록물은 기록물 번호를 하위 id로 부여 (예: SRC-PRI-001/NAK-xxxx)
    use_for: [정책결정, 마을사업, 지도자교육, 성과보고]

