[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "saemaul-mcp"
version = "0.2.0"
description = "Saemaul Undong (South Korea, 1970s) primary records and scholarship over the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["mcp", "model-context-protocol", "saemaul", "새마을운동", "korea", "archives", "history"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Natural Language :: Korean",
  "Programming Language :: Python :: 3",
  "Topic :: Sociology :: History",
]
dependencies = ["mcp>=1.2.0", "PyYAML>=6.0"]

[project.scripts]
saemaul-mcp = "saemaul_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/saemaul_mcp"]

# 데이터를 패키지 안에 함께 넣는다. 설치해서 써도 저장소와 같게 동작한다.
# 스캔 원본(수십 MB)은 넣지 않는다. 저장소를 직접 받아야 받을 수 있다.
[tool.hatch.build.targets.wheel.force-include]
"data/sources.yaml" = "saemaul_mcp/data/sources.yaml"
"data/search_aliases.yaml" = "saemaul_mcp/data/search_aliases.yaml"
"data/documents" = "saemaul_mcp/data/documents"

[tool.hatch.build.targets.sdist]
include = ["src", "data", "scripts", "examples", "tests", "docs", "README.md", "README.ko.md", "NOTICE.md", "CONTRIBUTING.md", "LICENSE"]
exclude = ["data/scans"]
